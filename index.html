<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>VPOS Worker App</title>
<style>
  :root{
    --bg:#0b1210; --panel:#111a17; --panel2:#0e1614; --border:#22322c;
    --text:#e7f0ea; --muted:#8ea296; --accent:#3ddc84; --accent-dim:#1f7a4c;
    --warn:#e0a53d; --danger:#e0553d; --blue:#4a9de0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;}
  input,textarea{user-select:text;-webkit-user-select:text;}

  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);}

  header.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel2);position:sticky;top:0;z-index:10;}
  .conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .conn .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);}
  .conn.offline .dot{background:var(--warn);box-shadow:0 0 6px var(--warn);}
  .userchip{display:flex;align-items:center;gap:8px;}
  .userchip .name{font-size:13px;font-weight:600;}
  .userchip button{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:5px 10px;font-size:11px;}

  main{flex:1;padding:16px;padding-bottom:32px;}
  .screen{display:none;}
  .screen.active{display:block;}

  h2.title{font-size:17px;margin:0 0 2px 0;}
  .subtitle{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}

  .btn{background:var(--accent-dim);color:#fff;border:none;border-radius:10px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;width:100%;}
  .btn.secondary{background:var(--panel);border:1px solid var(--border);color:var(--text);}
  .btn.ghost{background:none;border:none;color:var(--accent);font-weight:500;padding:10px;}
  .btn.danger{background:var(--danger);}
  .btn.small{width:auto;padding:8px 12px;font-size:12px;}
  .btn:active{opacity:.85;}
  .btn:disabled{opacity:.5;}
  .btn-row{display:flex;gap:8px;}
  .btn-row .btn{flex:1;}

  input[type=text],input[type=number],input[type=tel],select,textarea{
    width:100%;background:var(--panel);border:1px solid var(--border);border-radius:10px;
    color:var(--text);padding:12px 14px;font-size:15px;margin-bottom:10px;
  }
  label.field-label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:36px 16px;line-height:1.5;}
  .empty .icon{font-size:30px;display:block;margin-bottom:10px;}

  .session-card .head{display:flex;justify-content:space-between;align-items:flex-start;}
  .session-card b{font-size:15px;}
  .session-card .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .session-card .timer{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin:10px 0;text-align:center;}
  .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;}
  .pill.active{background:rgba(61,220,132,.15);color:var(--accent);}
  .pill.paused{background:rgba(224,165,61,.15);color:var(--warn);}

  .pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;}
  .pinpad button{background:var(--panel);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:20px;padding:16px 0;}
  .pinpad button:active{background:var(--accent-dim);}
  .pindots{display:flex;justify-content:center;gap:12px;margin:20px 0;}
  .pindots span{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);}
  .pindots span.filled{background:var(--accent);border-color:var(--accent);}


  .activity-list{display:flex;flex-direction:column;gap:8px;}
  .activity-opt{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;text-align:left;}
  .activity-opt b{font-size:14px;display:block;}
  .activity-opt .meta{font-size:11px;color:var(--muted);margin-top:2px;}
  .activity-opt.selected{border-color:var(--accent);background:rgba(61,220,132,.08);}

  .bed-result{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .bed-result b{font-size:14px;}
  .bed-result .meta{font-size:12px;color:var(--muted);margin-top:2px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2620;border:1px solid var(--border);color:var(--text);padding:10px 18px;border-radius:20px;font-size:13px;z-index:100;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:90%;text-align:center;}
  .toast.error{border-color:var(--danger);color:#ffb3a3;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-backdrop.active{display:flex;}
  .modal{background:var(--panel);border-top:1px solid var(--border);border-radius:16px 16px 0 0;padding:20px;width:100%;max-width:480px;}

  #qrReaderBox{margin-bottom:10px;border-radius:10px;overflow:hidden;display:none;}
  .divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:16px 0;}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
</style>
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="conn" id="connIndicator"><span class="dot"></span><span id="connLabel">Connected</span></div>
    <div class="userchip" id="userChip" style="display:none;">
      <span class="name" id="userNameLabel"></span>
      <button id="logoutBtn">Log Out</button>
    </div>
  </header>

  <main>

    <!-- ===================== LOGIN ===================== -->
    <section class="screen active" id="screen-login">
      <h2 class="title">Junction City Ranch</h2>
      <div class="subtitle">Worker Login</div>
      <div id="loginForm">
        <label class="field-label" for="useridInput">User ID</label>
        <input type="text" id="useridInput" placeholder="e.g. lisa" autocomplete="off">
        <label class="field-label" for="pinInput">PIN</label>
        <input type="password" id="pinInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="4-digit PIN" autocomplete="off">
        <button class="btn" id="signInBtn">Sign In</button>
      </div>
    </section>

    <!-- ===================== MY ACTIVE SESSIONS ===================== -->
    <section class="screen" id="screen-home">
      <div class="row">
        <h2 class="title" style="margin:0;">My Active Sessions</h2>
        <button class="btn ghost" id="refreshHomeBtn">&#8635; Refresh</button>
      </div>
      <div class="subtitle" id="loggedInAsLabel"></div>
      <div id="sessionsBody"></div>
      <div style="margin-top:16px;" class="btn-row">
      </div>
      <button class="btn" id="startTaskBtn" style="margin-top:14px;">+ Start New Task</button>
      <button class="btn ghost" id="historyBtn" style="margin-top:4px;">View Completed History</button>
    </section>

    <!-- ===================== SCAN LOCATION ===================== -->
    <section class="screen" id="screen-scan">
      <h2 class="title">Scan Location</h2>
      <div class="subtitle">Scan or Enter QR Code</div>
      <input type="text" id="qrInput" placeholder="e.g. BED:B1-01" autocomplete="off">
      <button class="btn secondary" id="cameraToggleBtn">&#128247; Use Camera</button>
      <div id="qrReaderBox"></div>
      <button class="btn" id="processScanBtn" style="margin-top:10px;">Process Scan</button>

      <div class="divider">OR</div>

      <div class="subtitle">Search Beds (no camera needed)</div>
      <input type="text" id="bedSearchInput" placeholder="Search by Bed ID, Block, or Zone" autocomplete="off">
      <div id="bedSearchResults"></div>

      <button class="btn ghost" id="backToSessionsBtn" style="margin-top:14px;">Back to My Sessions</button>
    </section>

    <!-- ===================== BED DETAIL / START TASK ===================== -->
    <section class="screen" id="screen-bed">
      <h2 class="title" id="bedTitle">Bed</h2>
      <div class="card" id="bedInfoCard"></div>
      <div class="subtitle">Select an activity</div>
      <div class="activity-list" id="activityList"></div>
      <div id="quantitySection" style="display:none;margin-top:10px;">
        <label class="field-label" id="quantityLabel">Quantity</label>
        <input type="number" id="quantityInput" inputmode="decimal" placeholder="0">
      </div>
      <button class="btn" id="startSessionBtn" style="margin-top:14px;" disabled>Start Task</button>
      <button class="btn ghost" id="bedBackBtn">Back to Scan</button>
    </section>

    <!-- ===================== ACTIVE SESSION EXECUTION ===================== -->
    <section class="screen" id="screen-session">
      <div class="card session-card" id="activeSessionCard"></div>
      <div class="btn-row" style="margin-top:10px;">
        <button class="btn secondary" id="pauseResumeBtn">Pause</button>
        <button class="btn" id="completeBtn">Complete</button>
      </div>
      <button class="btn secondary" id="flagExceptionBtn" style="margin-top:10px;background:rgba(224,85,61,.12);border-color:var(--danger);color:#ffb3a3;">&#9888; Flag Exception</button>
      <button class="btn ghost" id="sessionBackBtn" style="margin-top:6px;">Back to My Sessions</button>
    </section>

    <!-- ===================== COMPLETED HISTORY ===================== -->
    <section class="screen" id="screen-history">
      <h2 class="title">Completed History</h2>
      <div class="subtitle">Your recent verified &amp; completed tasks</div>
      <div id="historyBody"></div>
      <button class="btn ghost" id="historyBackBtn" style="margin-top:10px;">Back to My Sessions</button>
    </section>

  </main>
</div>

<!-- Complete-session modal (quantity/notes) -->
<div class="modal-backdrop" id="completeModal">
  <div class="modal">
    <h2 class="title">Complete Task</h2>
    <div id="completeQtySection" style="display:none;">
      <label class="field-label" id="completeQtyLabel">Quantity</label>
      <input type="number" id="completeQtyInput" inputmode="decimal" placeholder="0">
    </div>
    <label class="field-label">Notes (optional)</label>
    <textarea id="completeNotesInput" rows="2" placeholder="Anything worth noting"></textarea>
    <div class="btn-row" style="margin-top:6px;">
      <button class="btn secondary" id="completeCancelBtn">Cancel</button>
      <button class="btn" id="completeConfirmBtn">Confirm Complete</button>
    </div>
  </div>
</div>

<!-- Exception modal -->
<div class="modal-backdrop" id="exceptionModal">
  <div class="modal">
    <h2 class="title">Flag Exception</h2>
    <label class="field-label">What's wrong?</label>
    <select id="exceptionTypeInput">
      <option value="PEST">Pest pressure</option>
      <option value="DISEASE">Disease</option>
      <option value="IRRIGATION">Irrigation fault</option>
      <option value="STAND_FAILURE">Stand failure</option>
      <option value="EQUIPMENT">Equipment issue</option>
      <option value="OTHER">Other</option>
    </select>
    <label class="field-label">Notes</label>
    <textarea id="exceptionNotesInput" rows="3" placeholder="Describe what you're seeing"></textarea>
    <div class="btn-row" style="margin-top:6px;">
      <button class="btn secondary" id="exceptionCancelBtn">Cancel</button>
      <button class="btn danger" id="exceptionConfirmBtn">Submit Exception</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

const DEFAULT_EXEC_URL = 'https://script.google.com/macros/s/AKfycbw0dOXaMs3iykTuhv3heOMyQck0i8dJYjO_To60lIOtsYGuL1Lshmxju8Gopt3SWKNy/exec';

// ============================================================
// State
// ============================================================
let EXEC_URL = localStorage.getItem('vpos_worker_exec_url') || DEFAULT_EXEC_URL;
let ONLINE = false;
let CURRENT_USER = null;      // {Worker_ID, Name, Role}
let SELECTED_WORKER = null;   // during login flow, before PIN
let PIN_BUFFER = '';
let OPEN_SESSIONS = [];
let ACTIVE_SESSION = null;    // session currently being timed on screen-session
let SELECTED_BED = null;
let SELECTED_ACTIVITY = null;
let TIMER_HANDLE = null;
let QR_SCANNER = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => (s===undefined||s===null) ? '' : String(s).replace(/[&<>]/g, c=>({'&':'&lt;','>':'&gt;','&':'&amp;'}[c]||c));

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $(id).classList.add('active');
}
function toast(msg, isError){
  const t = document.createElement('div');
  t.className = 'toast' + (isError ? ' error' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

// ============================================================
// API layer — talks to the Apps Script Web App; every call falls
// back to reading/simulating against SNAPSHOT when offline so the
// app is still browsable without a live connection.
// ============================================================
async function apiGet(action, params){
  params = params || {};
  const usp = new URLSearchParams(Object.assign({action}, params));
  const res = await fetch(EXEC_URL + '?' + usp.toString());
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function apiPost(action, body){
  const res = await fetch(EXEC_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({action}, body))
  });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function checkConnection(){
  try{
    const json = await apiGet('ping');
    ONLINE = !!(json && json.ok);
  } catch(err){
    ONLINE = false;
  }
  renderConnIndicator();
  if(ONLINE){
    await refreshLiveUsers();
  }
}

async function refreshLiveUsers(){
  try{
    const res = await apiGet('users');
    if(res && res.success){
      LIVE_USERS = res.users || [];
      // Only re-render the picker if we're still on the login screen —
      // don't yank the list out from under someone mid-PIN-entry.
      if($('screen-login').classList.contains('active') && !SELECTED_WORKER){
        renderWorkerSelect();
      }
    }
  } catch(err){
    // Live fetch failed after all — keep whatever list is already showing.
  }
}
function renderConnIndicator(){
  const el = $('connIndicator');
  el.classList.toggle('offline', !ONLINE);
  $('connLabel').textContent = ONLINE ? 'Connected' : 'Offline (demo data)';
}

// ============================================================
// Login
// ============================================================
let LIVE_USERS = null; // populated from the live USERS tab once connection is confirmed

function renderWorkerSelect(){
  // No list is rendered — login is a plain User ID + PIN form. This just
  // clears the fields so they're ready for the next person.
  const idInput = $('useridInput');
  const pinInput = $('pinInput');
  if(idInput) idInput.value = '';
  if(pinInput) pinInput.value = '';
}
function findUser(idOrName){
  const source = LIVE_USERS || SNAPSHOT.USERS || [];
  const users = source.filter(u => (u.Status||'').toUpperCase() === 'ACTIVE');
  const query = (idOrName||'').trim().toLowerCase();
  if(!query) return null;
  return users.find(u =>
    (u.Worker_ID||'').trim().toLowerCase() === query ||
    (u.Name||'').trim().toLowerCase() === query
  ) || null;
}
async function onSignIn(){
  const idVal = $('useridInput').value;
  const pinVal = $('pinInput').value;
  if(!idVal.trim()){ toast('Enter your User ID', true); return; }
  if(!/^\d{4}$/.test(pinVal)){ toast('PIN must be 4 digits', true); return; }
  const user = findUser(idVal);
  if(!user){
    toast('User ID not found', true);
    return;
  }
  SELECTED_WORKER = {Worker_ID: user.Worker_ID, Name: user.Name};
  PIN_BUFFER = pinVal;
  await attemptLogin();
}
async function attemptLogin(){
  if(!ONLINE){
    // Offline demo mode: any 4-digit PIN logs in as the selected worker.
    CURRENT_USER = SELECTED_WORKER;
    onLoginSuccess();
    return;
  }
  try{
    const res = await apiPost('login', {worker_id: SELECTED_WORKER.Worker_ID, pin: PIN_BUFFER});
    if(res.success){
      CURRENT_USER = {Worker_ID: SELECTED_WORKER.Worker_ID, Name: res.name || SELECTED_WORKER.Name, Role: res.role};
      onLoginSuccess();
    } else {
      toast(res.error || 'Incorrect PIN', true);
      $('pinInput').value = '';
    }
  } catch(err){
    toast('Login failed: ' + err.message, true);
    $('pinInput').value = '';
  }
}
function onLoginSuccess(){
  $('userChip').style.display = 'flex';
  $('userNameLabel').textContent = CURRENT_USER.Name;
  $('loggedInAsLabel').textContent = `Logged in as ${CURRENT_USER.Name}`;
  goHome();
}
async function logout(){
  if(ONLINE && CURRENT_USER){
    try{ await apiPost('logout', {worker_id: CURRENT_USER.Worker_ID}); } catch(err){}
  }
  CURRENT_USER = null; SELECTED_WORKER = null; PIN_BUFFER = '';
  $('userChip').style.display = 'none';
  renderWorkerSelect();
  showScreen('screen-login');
}

// ============================================================
// Home — My Active Sessions
// ============================================================
async function goHome(){
  showScreen('screen-home');
  await loadOpenSessions();
}
async function loadOpenSessions(){
  if(ONLINE){
    try{
      const res = await apiGet('my-sessions', {worker_id: CURRENT_USER.Worker_ID});
      OPEN_SESSIONS = res.sessions || [];
    } catch(err){
      toast('Could not refresh sessions', true);
      OPEN_SESSIONS = [];
    }
  } else {
    OPEN_SESSIONS = (SNAPSHOT.FIELD_LIVE_SESSION || []).filter(s =>
      s.Worker_ID === CURRENT_USER.Worker_ID && ['ACTIVE','PAUSED'].includes((s.Status||'').toUpperCase()));
  }
  renderSessions();
}
function renderSessions(){
  const body = $('sessionsBody');
  if(OPEN_SESSIONS.length === 0){
    body.innerHTML = `<div class="empty"><span class="icon">&#128721;</span>No active tasks right now. Scan a bed to start one.</div>`;
    return;
  }
  body.innerHTML = OPEN_SESSIONS.map(s => `
    <div class="card session-card" data-session-id="${esc(s.Session_ID)}" onclick="openSession('${esc(s.Session_ID)}')">
      <div class="head">
        <div>
          <b>${esc(s.Bed_ID)}</b>
          <div class="meta">${esc(s.Activity_Name||'—')}</div>
        </div>
        <span class="pill ${(s.Status||'').toLowerCase()}">${esc(s.Status)}</span>
      </div>
    </div>`).join('');
}
function openSession(sessionId){
  ACTIVE_SESSION = OPEN_SESSIONS.find(s => s.Session_ID === sessionId);
  if(!ACTIVE_SESSION) return;
  showScreen('screen-session');
  renderActiveSession();
  startTimer();
}

// ============================================================
// Scan Location
// ============================================================
function goScan(){
  showScreen('screen-scan');
  $('qrInput').value = '';
  $('bedSearchInput').value = '';
  $('bedSearchResults').innerHTML = '';
  stopQrScanner();
}
function startQrScanner(){
  if(typeof Html5Qrcode === 'undefined'){ toast('Camera scanner unavailable offline', true); return; }
  $('qrReaderBox').style.display = 'block';
  $('qrReaderBox').innerHTML = '<div id="qrReaderInner" style="width:100%;"></div>';
  QR_SCANNER = new Html5Qrcode('qrReaderInner');
  QR_SCANNER.start({facingMode:'environment'}, {fps:10, qrbox:220}, (decodedText) => {
    $('qrInput').value = decodedText;
    stopQrScanner();
    processScan();
  }).catch(() => toast('Could not start camera', true));
}
function stopQrScanner(){
  if(QR_SCANNER){
    QR_SCANNER.stop().catch(()=>{});
    QR_SCANNER = null;
  }
  $('qrReaderBox').style.display = 'none';
  $('qrReaderBox').innerHTML = '';
}
async function processScan(){
  const raw = $('qrInput').value.trim();
  if(!raw){ toast('Enter or scan a code first', true); return; }
  const bedId = raw.replace(/^BED:/i, '').trim();
  await lookupBed(bedId);
}
async function lookupBed(bedId){
  let bed = null;
  if(ONLINE){
    try{
      const res = await apiGet('scan', {code: bedId});
      bed = res.bed || null;
      if(!bed){ toast(res.error || 'Bed not found', true); return; }
    } catch(err){
      toast('Scan failed: ' + err.message, true); return;
    }
  } else {
    bed = (SNAPSHOT.BED_MASTER || []).find(b => (b.Bed_ID||'').toUpperCase() === bedId.toUpperCase());
    if(!bed){ toast('Bed not found in snapshot', true); return; }
  }
  openBedDetail(bed);
}
async function searchBeds(){
  const q = $('bedSearchInput').value.trim();
  if(q.length < 1){ $('bedSearchResults').innerHTML = ''; return; }
  let results = [];
  if(ONLINE){
    try{
      const res = await apiGet('search-beds', {q});
      results = res.beds || [];
    } catch(err){ results = []; }
  } else {
    const uq = q.toUpperCase();
    results = (SNAPSHOT.BED_MASTER || []).filter(b =>
      (b.Bed_ID||'').toUpperCase().includes(uq) ||
      (b.Block_ID||'').toUpperCase().includes(uq) ||
      (b.Zone||'').toUpperCase().includes(uq)).slice(0,15);
  }
  $('bedSearchResults').innerHTML = results.map(b => `
    <div class="bed-result" onclick='selectSearchedBed(${JSON.stringify(b.Bed_ID)})'>
      <b>${esc(b.Bed_ID)}</b>
      <div class="meta">${esc(b.Block_ID||'—')}${b.Zone?' · '+esc(b.Zone):''} · ${esc(b.Bed_Status||'No status set')}</div>
    </div>`).join('') || `<div class="empty" style="padding:16px;">No matching beds.</div>`;
}
function selectSearchedBed(bedId){
  lookupBed(bedId);
}

// ============================================================
// Bed detail + activity picker
// ============================================================
function openBedDetail(bed){
  SELECTED_BED = bed;
  SELECTED_ACTIVITY = null;
  $('bedTitle').textContent = bed.Bed_ID;
  $('bedInfoCard').innerHTML = `
    <div class="meta">Block ${esc(bed.Block_ID||'—')}${bed.Zone?' · Zone '+esc(bed.Zone):''}</div>
    <div style="margin-top:6px;"><b>${bed.Current_Cohort_ID ? esc(bed.Current_Cohort_ID) : 'No cohort assigned'}</b></div>
    <div class="meta">Status: ${esc(bed.Bed_Status||'Not set')}</div>`;

  const stage = bed.Current_Cohort_ID ? 'Growing' : 'PrePlanting';
  const activities = (SNAPSHOT.ACTIVITY_REFERENCE || []).filter(a => {
    if(!a.Is_Worker_Executable) return false;
    const stages = (a.Allowed_Lifecycle_Stages||'').split(',').map(s=>s.trim());
    return stages.length === 0 || stages.includes('') || stages.includes(stage) || (a.Allowed_Lifecycle_Stages||'').indexOf(stage) > -1 || !a.Allowed_Lifecycle_Stages;
  });
  $('activityList').innerHTML = activities.map(a => `
    <button class="activity-opt" data-name="${esc(a.Activity_Name)}" data-qty="${a.Is_Quantity_Based ? '1':'0'}" data-unit="${esc(a.Default_Unit||'')}">
      <b>${esc(a.Activity_Name)}</b>
      <div class="meta">${esc(a.Description||'')}</div>
    </button>`).join('');
  $('activityList').querySelectorAll('.activity-opt').forEach(btn => {
    btn.addEventListener('click', () => {
      $('activityList').querySelectorAll('.activity-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      SELECTED_ACTIVITY = {name: btn.dataset.name, qtyBased: btn.dataset.qty === '1', unit: btn.dataset.unit};
      $('quantitySection').style.display = SELECTED_ACTIVITY.qtyBased ? 'block' : 'none';
      $('quantityLabel').textContent = 'Quantity' + (SELECTED_ACTIVITY.unit ? ' (' + SELECTED_ACTIVITY.unit + ')' : '');
      $('startSessionBtn').disabled = false;
    });
  });
  $('startSessionBtn').disabled = true;
  $('quantitySection').style.display = 'none';
  showScreen('screen-bed');
}
async function startSession(){
  if(!SELECTED_ACTIVITY) return;
  const qty = SELECTED_ACTIVITY.qtyBased ? $('quantityInput').value : null;
  let sessionId = 'SESS-' + Date.now();
  if(ONLINE){
    try{
      const res = await apiPost('start-session', {
        worker_id: CURRENT_USER.Worker_ID,
        bed_id: SELECTED_BED.Bed_ID,
        activity_name: SELECTED_ACTIVITY.name,
        quantity: qty
      });
      if(!res.success){ toast(res.error || 'Could not start task', true); return; }
      sessionId = res.session_id;
    } catch(err){ toast('Start failed: ' + err.message, true); return; }
  }
  ACTIVE_SESSION = {
    Session_ID: sessionId, Worker_ID: CURRENT_USER.Worker_ID, Bed_ID: SELECTED_BED.Bed_ID,
    Activity_Name: SELECTED_ACTIVITY.name, Start_Time: new Date().toISOString(),
    Status: 'ACTIVE', _pauseSeconds: 0
  };
  OPEN_SESSIONS.push(ACTIVE_SESSION);
  showScreen('screen-session');
  renderActiveSession();
  startTimer();
  toast('Task started');
}

// ============================================================
// Active session execution
// ============================================================
function elapsedSeconds(s){
  const start = new Date(s.Start_Time).getTime();
  const now = Date.now();
  const pause = (s._pauseSeconds || 0) * 1000;
  return Math.max(0, Math.floor((now - start - pause) / 1000));
}
function fmtElapsed(sec){
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return [h,m,s].map(v => String(v).padStart(2,'0')).join(':');
}
function renderActiveSession(){
  if(!ACTIVE_SESSION) return;
  const paused = (ACTIVE_SESSION.Status||'').toUpperCase() === 'PAUSED';
  $('activeSessionCard').innerHTML = `
    <div class="head">
      <div><b>${esc(ACTIVE_SESSION.Bed_ID)}</b><div class="meta">${esc(ACTIVE_SESSION.Activity_Name)}</div></div>
      <span class="pill ${paused?'paused':'active'}">${paused?'PAUSED':'ACTIVE'}</span>
    </div>
    <div class="timer" id="liveTimer">${fmtElapsed(elapsedSeconds(ACTIVE_SESSION))}</div>`;
  $('pauseResumeBtn').textContent = paused ? 'Resume' : 'Pause';
}
function startTimer(){
  clearInterval(TIMER_HANDLE);
  TIMER_HANDLE = setInterval(() => {
    if(!ACTIVE_SESSION || (ACTIVE_SESSION.Status||'').toUpperCase() === 'PAUSED') return;
    const el = $('liveTimer');
    if(el) el.textContent = fmtElapsed(elapsedSeconds(ACTIVE_SESSION));
  }, 1000);
}
async function togglePauseResume(){
  if(!ACTIVE_SESSION) return;
  const paused = (ACTIVE_SESSION.Status||'').toUpperCase() === 'PAUSED';
  const action = paused ? 'resume-session' : 'pause-session';
  if(ONLINE){
    try{
      const res = await apiPost(action, {session_id: ACTIVE_SESSION.Session_ID});
      if(!res.success){ toast(res.error || 'Action failed', true); return; }
    } catch(err){ toast('Action failed: ' + err.message, true); return; }
  }
  ACTIVE_SESSION.Status = paused ? 'ACTIVE' : 'PAUSED';
  renderActiveSession();
}
function openCompleteModal(){
  $('completeQtySection').style.display = 'none';
  $('completeNotesInput').value = '';
  const act = (SNAPSHOT.ACTIVITY_REFERENCE || []).find(a => a.Activity_Name === ACTIVE_SESSION.Activity_Name);
  if(act && act.Is_Quantity_Based){
    $('completeQtySection').style.display = 'block';
    $('completeQtyLabel').textContent = 'Quantity' + (act.Default_Unit ? ' (' + act.Default_Unit + ')' : '');
    $('completeQtyInput').value = '';
  }
  $('completeModal').classList.add('active');
}
async function confirmComplete(){
  const qty = $('completeQtyInput').value;
  const notes = $('completeNotesInput').value;
  if(ONLINE){
    try{
      const res = await apiPost('complete-session', {session_id: ACTIVE_SESSION.Session_ID, quantity: qty, notes});
      if(!res.success){ toast(res.error || 'Could not complete', true); return; }
    } catch(err){ toast('Complete failed: ' + err.message, true); return; }
  }
  $('completeModal').classList.remove('active');
  OPEN_SESSIONS = OPEN_SESSIONS.filter(s => s.Session_ID !== ACTIVE_SESSION.Session_ID);
  clearInterval(TIMER_HANDLE);
  ACTIVE_SESSION = null;
  toast('Task completed');
  goHome();
}
function openExceptionModal(){
  $('exceptionNotesInput').value = '';
  $('exceptionModal').classList.add('active');
}
async function confirmException(){
  const type = $('exceptionTypeInput').value;
  const notes = $('exceptionNotesInput').value;
  if(ONLINE){
    try{
      const res = await apiPost('flag-exception', {session_id: ACTIVE_SESSION.Session_ID, exception_type: type, notes});
      if(!res.success){ toast(res.error || 'Could not flag exception', true); return; }
    } catch(err){ toast('Flag failed: ' + err.message, true); return; }
  }
  $('exceptionModal').classList.remove('active');
  toast('Exception logged for a manager to review');
}

// ============================================================
// Completed history
// ============================================================
async function goHistory(){
  showScreen('screen-history');
  let rows = [];
  if(ONLINE){
    try{
      const res = await apiGet('session-history', {worker_id: CURRENT_USER.Worker_ID});
      rows = res.history || [];
    } catch(err){ rows = []; }
  } else {
    rows = (SNAPSHOT.FIELD_ACTIVITY_LOG || []).filter(r => r.Worker_ID === CURRENT_USER.Worker_ID);
  }
  const body = $('historyBody');
  if(rows.length === 0){
    body.innerHTML = `<div class="empty"><span class="icon">&#128209;</span>No completed tasks on file yet.</div>`;
  } else {
    body.innerHTML = rows.slice(0,30).map(r => `
      <div class="card">
        <b>${esc(r.Bed_ID)}</b> · ${esc(r.Activity_Name)}
        <div class="meta">${r.Start_Time ? new Date(r.Start_Time).toLocaleDateString() : ''} ${r.Elapsed_Minutes ? '· '+r.Elapsed_Minutes+' min' : ''} ${r.Quantity ? '· '+r.Quantity+' '+(r.Unit||'') : ''}</div>
      </div>`).join('');
  }
}

// ============================================================
// Wiring
// ============================================================
$('logoutBtn').addEventListener('click', logout);
$('refreshHomeBtn').addEventListener('click', loadOpenSessions);
$('startTaskBtn').addEventListener('click', goScan);
$('historyBtn').addEventListener('click', goHistory);
$('historyBackBtn').addEventListener('click', goHome);
$('backToSessionsBtn').addEventListener('click', goHome);
$('bedBackBtn').addEventListener('click', goScan);
$('sessionBackBtn').addEventListener('click', goHome);
$('signInBtn').addEventListener('click', onSignIn);
$('pinInput').addEventListener('keydown', (e) => { if(e.key === 'Enter') onSignIn(); });
$('cameraToggleBtn').addEventListener('click', () => { QR_SCANNER ? stopQrScanner() : startQrScanner(); });
$('processScanBtn').addEventListener('click', processScan);
$('bedSearchInput').addEventListener('input', searchBeds);
$('startSessionBtn').addEventListener('click', startSession);
$('pauseResumeBtn').addEventListener('click', togglePauseResume);
$('completeBtn').addEventListener('click', openCompleteModal);
$('completeCancelBtn').addEventListener('click', () => $('completeModal').classList.remove('active'));
$('completeConfirmBtn').addEventListener('click', confirmComplete);
$('flagExceptionBtn').addEventListener('click', openExceptionModal);
$('exceptionCancelBtn').addEventListener('click', () => $('exceptionModal').classList.remove('active'));
$('exceptionConfirmBtn').addEventListener('click', confirmException);

renderWorkerSelect();
checkConnection();
</script>
