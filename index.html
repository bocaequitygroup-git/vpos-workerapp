<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VPOS Field App</title>
<style>
:root{--bg:#f4f3ee;--card:#ffffff;--text:#1c1e1a;--sub:#6c6f66;--accent:#2f6b3c;--accent-d:#245430;--warn:#c1531f;--border:#e2ded2;--radius:14px;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14170f;--card:#1e2318;--text:#eceae2;--sub:#9a9c8f;--border:#33372a;}}
:root[data-theme="dark"]{--bg:#14170f;--card:#1e2318;--text:#eceae2;--sub:#9a9c8f;--border:#33372a;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,Segoe UI,Arial,sans-serif;min-height:100vh;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
.wrap{max-width:460px;margin:0 auto;padding:14px 16px 40px;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:2px 0 14px;}
.topbar .name{font-weight:700;font-size:15px;}
.topbar .role{color:var(--sub);font-size:12px;}
h1{font-size:19px;margin:4px 0 12px;}
label{font-size:13px;color:var(--sub);display:block;margin-bottom:4px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px;}
.btn{background:var(--accent);color:#fff;border:none;padding:13px 16px;border-radius:var(--radius);font-size:15px;font-weight:700;cursor:pointer;}
.btn:active{background:var(--accent-d);}
.btn.secondary{background:transparent;color:var(--accent);border:1.5px solid var(--accent);}
.btn.warn{background:var(--warn);}
.btn.block{width:100%;}
.btn[disabled]{opacity:.45;pointer-events:none;}
input[type=text],input[type=password],input[type=number]{width:100%;padding:13px;border-radius:var(--radius);border:1.5px solid var(--border);font-size:16px;background:var(--bg);color:var(--text);}
.sub{color:var(--sub);font-size:13px;}
.center{text-align:center;}
.timer{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;}
.row{display:flex;gap:8px;margin-top:8px;}
.row>*{flex:1;}
.bed-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);cursor:pointer;}
.bed-row:last-child{border-bottom:none;}
.bed-id{font-weight:700;}
.link{color:var(--accent);text-decoration:none;font-size:14px;display:inline-block;margin-top:10px;cursor:pointer;}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--accent);color:#fff;}
.badge.paused{background:var(--warn);}
.err{color:var(--warn);font-size:13px;margin:8px 0;}
.banner{background:var(--warn);color:#fff;padding:10px 12px;border-radius:var(--radius);font-size:13px;margin-bottom:10px;}
.act-btn{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px;margin-bottom:8px;font-size:15px;color:var(--text);cursor:pointer;}
.act-btn.sel{border-color:var(--accent);background:rgba(47,107,60,0.12);}
.act-groups{margin-top:4px;}
.grp-title{font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--sub);margin:14px 0 6px;}
.grp-title:first-child{margin-top:4px;}
.act-btn.compact{padding:10px 12px;margin-bottom:6px;font-size:14px;}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;}
.conn-pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--accent);background:rgba(47,107,60,0.12);padding:4px 10px;border-radius:20px;margin-bottom:10px;}
.conn-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);}
.conn-pill.off{color:var(--warn);background:rgba(193,83,31,0.12);}
.conn-pill.off .dot{background:var(--warn);}
.detail-row{margin-top:6px;font-size:14px;}
.qa-grid{display:flex;gap:8px;margin:8px 0 2px;}
.qa-grid>*{flex:1;}
.qa-btn{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 4px;font-size:11.5px;font-weight:700;color:var(--text);cursor:pointer;text-align:center;}
.qa-btn:active{background:rgba(47,107,60,0.12);}
.qa-btn.sel{border-color:var(--accent);background:rgba(47,107,60,0.12);}
.qa-icon{font-size:21px;}
.hist{font-size:13px;color:var(--sub);padding:6px 2px 0;border-top:1px solid var(--border);margin-top:8px;}
.hist-row{padding:4px 0;}
.tote-box{font-size:13px;color:var(--sub);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin:8px 0;}
.tote-box .tote-hd{display:flex;justify-content:space-between;align-items:center;color:var(--text);font-weight:700;}
.tote-item{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-top:1px solid var(--border);margin-top:4px;}
.tote-rm{color:var(--warn);cursor:pointer;font-size:12px;font-weight:700;}
.break-grid{display:flex;gap:8px;margin-top:6px;}
.break-grid>*{flex:1;}
.btn.small{padding:8px 12px;font-size:13px;flex:0 0 auto;}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<script>
/* ================= Backend wiring ================= */
const API_URL='https://script.google.com/macros/s/AKfycbw0dOXaMs3iykTuhv3heOMyQck0i8dJYjO_To60lIOtsYGuL1Lshmxju8Gopt3SWKNy/exec';
const APP_KEY='WorkerApp';

async function api(action,payload){
 payload=Object.assign({action:action},payload||{});
 if(st.token && action!=='login') payload.token=st.token;
 try{
  const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  const r=await res.json();
  st.connected=true;
  return r;
 }catch(e){ st.connected=false; return {ok:false,error:'Could not reach the server. Check your connection.',code:'NETWORK_ERROR'}; }
}
/** returns true if it handled (logged the user out) a dead-session error */
function handleAuthError(r){
 if(!r.ok && r.code==='UNAUTHENTICATED'){ st.err=r.error||'Your session ended. Sign in again.'; doLogout(false); return true; }
 return false;
}

/* ================= Static reference data =================
   Sourced directly from the live VPOS_System.xlsx (BED_MASTER, ACTIVITY_REFERENCE,
   COHORT_PRODUCTION, MANAGER_QUEUE). No worker-facing read endpoint exists yet on the
   backend for LIVE bed/cohort/status/queue data, so BED_STATE_SNAPSHOT / COHORT_SNAPSHOT /
   ACTIVITY_LOG_SNAPSHOT below are this workbook's last-known state, not a live feed --
   they need to be replaced by real "get-bed-detail" / "get-bed-history" / "get-assigned-tasks"
   routes (or refreshed by hand) to stay accurate. BED_MASTER.Zone is not populated for any
   bed in the current workbook, so Zone is omitted from the UI until that column has
   real data. */
const BLOCKS=[['B1','Block 1',55],['B2','Block 2',55],['B3','Block 3',55],['B4','Block 4',55],['Z5','Zone 5',11]];

// Bed_ID -> {status, cohortId} for any bed NOT at the BED_STATUS_RULES default (AVAILABLE, no cohort).
// NOTE: 'ASSIGNED' is the raw Bed_Status value currently in BED_MASTER for B4-01, but it is not one of
// the Valid_Bed_Status_Values on the BED_STATUS_RULES tab (AVAILABLE/RESERVED/PLANTED/GROWING/HARVEST
// READY/HARVESTING/POST-HARVEST ACTIVITIES/BLOCKED) -- per R02 a confirmed-but-unplanted cohort should
// read RESERVED. Shown as-is rather than silently relabeled; worth a data-integrity fix upstream.
const BED_STATE_SNAPSHOT={'B4-01':{status:'ASSIGNED',cohortId:'BET-C01'}};

// Cohort_ID -> lifecycle fields, from COHORT_PRODUCTION. actualDob is a plain 'YYYY-MM-DD' string
// (or null if Actual_DOB is blank, which is currently true for all 124 cohorts in the workbook --
// nothing has been planted yet. BET-C01 has Assignment_Status=ASSIGNED but no Actual_DOB, i.e.
// approved-but-not-yet-planted). currentStage mirrors Current_Stage verbatim (null until the sheet
// has a value, since Current_Stage is blank workbook-wide too); cropDay is intentionally NOT stored
// here and is instead computed live from actualDob by cropDayFor_() below, since Crop_Day is a moving
// target every day a cohort stays planted and a snapshot number would go stale immediately.
const COHORT_SNAPSHOT={'BET-C01':{cropId:'BET',cropName:'Beets',assignmentStatus:'ASSIGNED',
 currentStage:null,actualDob:null,harvestWindowStart:'2026-04-25',harvestWindowEnd:'2026-05-10'}};
// Bed_ID -> [{activityName,workerId,endTime|startTime}], from FIELD_ACTIVITY_LOG. Currently empty workbook-wide.
const ACTIVITY_LOG_SNAPSHOT={};

// Full ACTIVITY_REFERENCE (36 rows as of the latest upload). workerExec mirrors
// Is_Worker_Executable exactly -- only ACT_021 StateChange is manager-only. This is the
// complete source-of-truth list; WORKER_ACTIVITY_GROUPS below (not this array) decides
// what the worker picklist actually shows and how it's grouped.
const ACTIVITIES=[
 {id:'ACT_001',name:'FieldPrep',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_002',name:'BedShaping',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_003',name:'Mulching',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_004',name:'TrellisingSetup',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_005',name:'IrrigationSetup',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_006',name:'Planting',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_007',name:'DirectSeeding',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_008',name:'Transplanting',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_009',name:'Replanting',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_010',name:'Thinning',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_011',name:'Weeding',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_012',name:'Fertilizing',domain:'CropCare',qtyBased:true,unit:'lbs',workerExec:true},
 {id:'ACT_013',name:'IrrigationCheck',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_014',name:'PestControl',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_015',name:'DiseaseControl',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_016',name:'Pruning',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_017',name:'Trellising',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_018',name:'Harvest',domain:'Harvest',qtyBased:true,unit:'lbs',workerExec:true},
 {id:'ACT_019',name:'PostHarvestCleanup',domain:'Harvest',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_020',name:'FieldTurnover',domain:'Harvest',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_021',name:'StateChange',domain:'State',qtyBased:false,unit:'',workerExec:false},
 {id:'ACT_022',name:'CropCleanup',domain:'State',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_023',name:'Scouting',domain:'State',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_024',name:'LandPrep',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_025',name:'Tillage',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_026',name:'BedForming',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_027',name:'Solarization',domain:'Prep',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_028',name:'Seeding',domain:'Planting',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_029',name:'Cultivation',domain:'CropCare',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_030',name:'Fertilization',domain:'CropCare',qtyBased:true,unit:'lbs',workerExec:true},
 {id:'ACT_031',name:'Irrigation',domain:'CropCare',qtyBased:true,unit:'gal',workerExec:true},
 {id:'ACT_032',name:'PestScouting',domain:'State',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_033',name:'DiseaseScouting',domain:'State',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_034',name:'CropInspection',domain:'State',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_035',name:'MaturityInspection',domain:'Harvest',qtyBased:false,unit:'',workerExec:true},
 {id:'ACT_036',name:'HarvestPrep',domain:'Harvest',qtyBased:false,unit:'',workerExec:true}
];
function actById(id){return ACTIVITIES.find(a=>a.id===id);}

// The worker-facing picklist. Deliberately NOT all 36 ACTIVITY_REFERENCE rows --
// this is the curated/grouped set (verified against the live tab), leaving out the
// older activities their own Notes column marks as superseded by a newer row:
// FieldPrep->LandPrep, BedShaping->BedForming, DirectSeeding->Seeding, Fertilizing->Fertilization,
// plus Mulching, TrellisingSetup, IrrigationSetup, generic Planting, PostHarvestCleanup,
// generic Scouting, and the manager-only StateChange.
const WORKER_ACTIVITY_GROUPS=[
 {title:'Field Preparation',items:[
   {id:'ACT_024',label:'Land Prep'},{id:'ACT_025',label:'Tillage'},
   {id:'ACT_026',label:'Bed Forming'},{id:'ACT_027',label:'Solarization'}]},
 {title:'Planting / Establishment',items:[
   {id:'ACT_028',label:'Seeding'},{id:'ACT_008',label:'Transplanting'},
   {id:'ACT_010',label:'Thinning'},{id:'ACT_009',label:'Replanting'}]},
 {title:'Crop Maintenance',items:[
   {id:'ACT_029',label:'Cultivation'},{id:'ACT_011',label:'Weeding'},
   {id:'ACT_017',label:'Trellising'},{id:'ACT_016',label:'Pruning'},
   {id:'ACT_030',label:'Fertilization'},{id:'ACT_031',label:'Irrigation'},
   {id:'ACT_013',label:'Irrigation Check'}]},
 {title:'Scouting / Protection',items:[
   {id:'ACT_032',label:'Pest Scouting'},{id:'ACT_033',label:'Disease Scouting'},
   {id:'ACT_014',label:'Pest Control'},{id:'ACT_015',label:'Disease Control'},
   {id:'ACT_034',label:'Crop Inspection'},{id:'ACT_035',label:'Maturity Inspection'}]},
 {title:'Harvest',items:[
   {id:'ACT_036',label:'Harvest Prep'},{id:'ACT_018',label:'Harvest'}]},
 {title:'Turnover',items:[
   {id:'ACT_022',label:'Crop Cleanup'},{id:'ACT_020',label:'Field Turnover'}]}
];

// Field Actions shortcuts -- now mapped to the real, literal activities confirmed in
// the updated ACTIVITY_REFERENCE: ACT_031 Irrigation is the actual watering event
// (qty-based, gal), resolving the earlier guess against IrrigationCheck.
const QUICK_ACTIONS=[
 {id:'ACT_031',icon:'💧',label:'Log Water Pass'},
 {id:'ACT_030',icon:'🧪',label:'Log Fertilizer'},
 {id:'ACT_011',icon:'🌿',label:'Log Weeding'}
];

// Full CROP_REFERENCE (40 rows as of the latest upload) -- used only by the Planting
// branch's crop picker (see PLANTING_ACTIVITY_IDS below), to let a worker name what's
// going into a bed that has no cohort yet.
const CROP_REFERENCE=[
 {id:'MCH',name:'Mchicha',category:'African Leafy Greens'},{id:'AMA-L',name:'Amaranth (Leafy)',category:'African Leafy Greens'},
 {id:'SUK',name:'Sukuma Wiki',category:'African Leafy Greens'},{id:'MUS',name:'Mustard Greens',category:'African Leafy Greens'},
 {id:'CHD',name:'Swiss Chard',category:'African Leafy Greens'},{id:'CPL',name:'Cowpea Leaves',category:'African Leafy Greens'},
 {id:'SPD',name:'Spider Plant',category:'African Leafy Greens'},{id:'BTL',name:'Bitter Leaf',category:'African Leafy Greens'},
 {id:'UGW',name:'Ugwu',category:'African Leafy Greens'},{id:'SP',name:'Sweet Potatoes',category:'Tropical Tubers & Perennials'},
 {id:'TY',name:'True Yams',category:'Tropical Tubers & Perennials'},{id:'CAS',name:'Cassava',category:'Tropical Tubers & Perennials'},
 {id:'PLN',name:'Plantains',category:'Tropical Tubers & Perennials'},{id:'CAR',name:'Carrots',category:'Cool-Season Roots'},
 {id:'BET',name:'Beets',category:'Cool-Season Roots'},{id:'TUR',name:'Turnips',category:'Cool-Season Roots'},
 {id:'ONI',name:'Onions',category:'Bulb Crops'},{id:'ASP',name:'Asparagus',category:'Perennial Crown'},
 {id:'SB',name:'Scotch Bonnet',category:'Warm-Season Fruiting Crops'},{id:'HAB',name:'Habanero',category:'Warm-Season Fruiting Crops'},
 {id:'BEC',name:'Bird’s Eye Chili',category:'Warm-Season Fruiting Crops'},{id:'BEL',name:'Bell Pepper',category:'Warm-Season Fruiting Crops'},
 {id:'AFE',name:'African Eggplant',category:'Warm-Season Fruiting Crops'},{id:'EGG',name:'Eggplant',category:'Warm-Season Fruiting Crops'},
 {id:'TOM',name:'Tomatoes',category:'Warm-Season Fruiting Crops'},{id:'CUC',name:'Cucumber',category:'Warm-Season Fruiting Crops'},
 {id:'OKR',name:'Okra',category:'Warm-Season Fruiting Crops'},{id:'LET',name:'Lettuce',category:'Cool-Season Brassicas & Greens'},
 {id:'KAL',name:'Kale',category:'Cool-Season Brassicas & Greens'},{id:'SPI',name:'Spinach',category:'Cool-Season Brassicas & Greens'},
 {id:'BRO',name:'Broccoli',category:'Cool-Season Brassicas & Greens'},{id:'CAU',name:'Cauliflower',category:'Cool-Season Brassicas & Greens'},
 {id:'CAB',name:'Cabbage',category:'Cool-Season Brassicas & Greens'},{id:'COL',name:'Collard Greens',category:'Cool-Season Brassicas & Greens'},
 {id:'AMG',name:'Amaranth Grain',category:'Grain Crops'},{id:'CPG',name:'Cowpea Grain',category:'Grain Crops'},
 {id:'CLV',name:'Clover',category:'Cover Crops'},{id:'RYE',name:'Rye',category:'Cover Crops'},
 {id:'VET',name:'Vetch',category:'Cover Crops'},{id:'BKW',name:'Buckwheat',category:'Cover Crops'}
];
function cropById(id){return CROP_REFERENCE.find(c=>c.id===id);}

// Scouting vocabulary, locked elsewhere in the project across SCOUT_FINDING/EXCEPTION_LOG.
const SCOUT_DOMAINS=[['PlantCondition','Plant Condition'],['PestPressure','Pest Pressure'],
 ['DiseasePressure','Disease Pressure'],['SoilWater','Soil & Water'],['WeedCompetition','Weed & Competition']];
const SCOUT_SEVERITIES=['LOW','MEDIUM','HIGH','CRITICAL'];

// Worker-raised exceptions mid-task (Active Session "Report Issue" -- distinct from Scout
// Finding, which is a scouting observation that MAY open an exception. This is the worker
// directly flagging something blocking or wrong with the task itself). Writes straight to
// EXCEPTION_LOG via reportException_(), which already exists in ActivityEngine.gs and already
// takes exactly these fields (Exception_Type/Blocked_Reason/Exception_Notes/Severity/Photo_URL)
// -- only the 'report-exception' routeAction_ case + AUTH_POLICY entry are new. See the
// VPOS_Backend_Patch_ExceptionsAndPause.gs addendum.
const EXCEPTION_TYPES=[['Blocked','Blocked / Cannot Proceed'],['Equipment','Equipment Issue'],
 ['Safety','Safety Concern'],['CropDamage','Crop / Bed Damage'],['Other','Other']];
// Severity reuses SCOUT_SEVERITIES -- EXCEPTION_LOG.Severity is the same LOW/MEDIUM/HIGH/CRITICAL
// vocabulary for both paths, no reason to diverge.

// Break/Lunch/End of Day reason codes for the Active Session Pause action. FIELD_LIVE_SESSION
// has no dedicated reason column -- the reason rides along on pause-activity as `reason` and
// (per the backend addendum) gets appended to the existing Pause_Time(s) entry as
// "<ISO timestamp>|<reason>", so no schema change is needed, just a small pauseActivity_ tweak.
const BREAK_REASONS=[['Break','☕','Break'],['Lunch','🍽️','Lunch'],['EndOfDay','🏁','End of Day']];
function breakLabel(code){const b=BREAK_REASONS.find(x=>x[0]===code);return b?b[2]:code;}

/* ---- Select Activity branching (Normal / Planting / Harvest) ----
 * ACT_006/007/008/009/028 (Planting/DirectSeeding/Transplanting/Replanting/Seeding) put a
 * NEW crop into the ground -- if the bed has no cohort yet, the worker has to say which crop.
 * ACT_018 (Harvest) gets an optional read-only look at the cohort's planned harvest window so
 * the worker can see if they're early/on time/overdue before starting. Everything else is
 * the plain "pick activity, start task" flow this app already had. */
function branchFor(activityId){
 if(PLANTING_ACTIVITY_IDS.includes(activityId))return'planting';
 if(activityId==='ACT_018')return'harvest';
 return'normal';
}

function allBeds(){const out=[];for(const[p,,n]of BLOCKS){for(let i=1;i<=n;i++)out.push(p+'-'+String(i).padStart(2,'0'));}return out;}
function bedBlock(id){const p=id.split('-')[0];const b=BLOCKS.find(x=>x[0]===p);return b?b[1]:'';}

/* ---- Bed Snapshot helpers (Stage/Day, Planting date, Harvest estimate) ---- */
function parseDateOnly_(s){return s?new Date(s+'T00:00:00'):null;}
function fmtDate_(s){const d=parseDateOnly_(s);return d?d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}):null;}
/** Crop_Day is a moving target once a cohort is planted -- compute it live from Actual_DOB
 *  rather than trust a snapshot number that goes stale the day after it's taken. */
function cropDayFor_(cohort){
 if(!cohort||!cohort.actualDob)return null;
 const start=parseDateOnly_(cohort.actualDob);
 return Math.max(1,Math.floor((Date.now()-start.getTime())/86400000)+1);
}
function stageLabel_(cohort){
 if(!cohort)return null;
 if(cohort.currentStage)return cohort.currentStage;
 return cohort.actualDob?'Growing':'Pre-Planting';
}
function bedDetail(id){
 const snap=BED_STATE_SNAPSHOT[id]||{};
 const status=snap.status||'AVAILABLE';
 const cohortId=snap.cohortId||null;
 const cohort=cohortId?COHORT_SNAPSHOT[cohortId]:null;
 return{bedId:id,block:bedBlock(id),zone:null,status:status,cohortId:cohortId,
  cropName:cohort?cohort.cropName:null,
  assignmentStatus:cohort?cohort.assignmentStatus:null,
  stage:stageLabel_(cohort),
  cropDay:cropDayFor_(cohort),
  plantingDate:cohort?cohort.actualDob:null,
  harvestStart:cohort?cohort.harvestWindowStart:null,
  harvestEnd:cohort?cohort.harvestWindowEnd:null};
}

/* ---- Assigned Tasks (My Active Sessions -> "Start assigned task") ----
 * A bed whose cohort has been manager-assigned (COHORT_PRODUCTION.Assignment_Status=
 * 'ASSIGNED', the same underlying event as a resolved MANAGER_QUEUE BED_ASSIGNMENT row)
 * but not yet planted (no Actual_DOB) is ready for any worker to pick up and plant --
 * this reads the cohort's own Assignment_Status rather than the queue row's Status so a
 * task doesn't vanish here the moment a manager approves it, only once it's actually planted.
 * Not worker-specific: MANAGER_QUEUE/COHORT_PRODUCTION have no Worker_ID column today, so
 * this is a shared pool ("assigned to the field", not "assigned to Lisa"), same as a
 * physical job board. Once this device has started (or finished) a planting-domain session
 * on that bed it drops off the list, so it doesn't keep nagging the same worker.
 *
 * LIVE as of this version -- loadAssignedTasks() below calls the 'get-assigned-tasks' route
 * (see VPOS_Backend_Patch_AssignedTasks.gs) instead of reading the hardcoded
 * BED_STATE_SNAPSHOT/COHORT_SNAPSHOT constants. Those constants are still used as a fallback
 * display source for beds this device hasn't heard about live yet (e.g. offline), and get
 * merged with real data the moment a live fetch succeeds -- see the .forEach() in
 * loadAssignedTasks(). */
const PLANTING_ACTIVITY_IDS=['ACT_006','ACT_007','ACT_008','ACT_009','ACT_028'];
function assignedTasks(){
 return(st.liveAssignedTasks||[]).filter(t=>!allSessions().some(s=>s.bedId===t.bedId&&PLANTING_ACTIVITY_IDS.includes(s.activityId)));
}
/** Fetches the live shared pool of manager-assigned-but-unplanted beds. Quiet on failure
 *  (no global error banner -- this is a background read, not a worker-initiated action) but
 *  visible: renderHome() shows a small inline note if the route isn't reachable, same spirit
 *  as pauseS()/resumeS()'s "not wired up yet" messaging, just scoped to its own section. */
async function loadAssignedTasks(){
 if(!st.me)return;
 st.loadingTasks=true;render();
 const r=await api('get-assigned-tasks',{});
 st.loadingTasks=false;
 if(handleAuthError(r))return;
 if(!r.ok){ st.liveAssignedTasks=[]; st.assignedTasksUnavailable=true; render(); return; }
 st.assignedTasksUnavailable=false;
 st.liveAssignedTasks=(r.data||[]).map(t=>({bedId:t.bedId,block:t.block||bedBlock(t.bedId),cohortId:t.cohortId,
  cropId:t.cropId,cropName:t.cropName,harvestWindowStart:t.harvestWindowStart||null,harvestWindowEnd:t.harvestWindowEnd||null}));
 // Merge into the local bed/cohort snapshot so navigating into one of these beds (Start
 // Planting -> Confirm Assignment) shows real Stage/Cohort/Harvest-est. info (item 2) instead
 // of the blanks a bed missing from the hardcoded snapshot would otherwise show.
 st.liveAssignedTasks.forEach(t=>{
  BED_STATE_SNAPSHOT[t.bedId]=Object.assign({},BED_STATE_SNAPSHOT[t.bedId],{status:'ASSIGNED',cohortId:t.cohortId});
  COHORT_SNAPSHOT[t.cohortId]=Object.assign({currentStage:null,actualDob:null},COHORT_SNAPSHOT[t.cohortId],
   {cropId:t.cropId,cropName:t.cropName,assignmentStatus:'ASSIGNED',harvestWindowStart:t.harvestWindowStart,harvestWindowEnd:t.harvestWindowEnd});
 });
 render();
}
function startAssignedTask(bedId){selectBed(bedId);}

/* ---- Live session sync (fixes: a session reassigned to this worker from another
 * device/worker never appeared here, since "My Active Sessions" is built from THIS
 * device's own localStorage -- see allSessions()/loadForMe() above -- and a session
 * started on one phone that gets reassigned to a different worker has never been
 * written to that worker's phone's localStorage at all. Backend now exposes
 * 'get-my-sessions' (auth.workerId-scoped read of FIELD_LIVE_SESSION, see
 * Code_main.gs) for exactly this gap. Same merge pattern as loadAssignedTasks():
 * a session this device already knows about is left untouched (its totes/
 * pauseReason are richer than what a raw FIELD_LIVE_SESSION row carries) -- this
 * only ADDS a session this device has never seen before. */
async function loadMySessions(){
 if(!st.me)return;
 const r=await api('get-my-sessions',{});
 if(handleAuthError(r))return;
 if(!r.ok)return; // quiet, same as loadAssignedTasks() -- background sync, not worker-initiated
 const local=allSessions();
 const localIds=new Set(local.map(s=>s.id));
 let changed=false;
 (r.data||[]).forEach(row=>{
  if(row.Status==='COMPLETED'||localIds.has(row.Session_ID))return;
  const act=ACTIVITIES.find(a=>a.name===row.Activity_Name)||{};
  const pauses=String(row['Pause_Time(s)']||'').split(',').map(s=>s.trim()).filter(Boolean);
  const resumes=String(row['Resume_Time(s)']||'').split(',').map(s=>s.trim()).filter(Boolean);
  let totalPausedMs=0,pausedAt=null;
  pauses.forEach((p,i)=>{
   const pAt=new Date(p).getTime(),rAt=resumes[i]?new Date(resumes[i]).getTime():null;
   if(rAt)totalPausedMs+=Math.max(0,rAt-pAt);else pausedAt=pAt;
  });
  local.push({id:row.Session_ID,workerId:st.me.workerId,bedId:row.Bed_ID,block:bedBlock(row.Bed_ID),
   activityId:act.id||null,activityName:row.Activity_Name,qtyBased:!!act.qtyBased,unit:act.unit||'',
   status:row.Status==='PAUSED'?'paused':'active',startTime:new Date(row.Start_Time).getTime(),
   totalPausedMs:totalPausedMs,pausedAt:pausedAt,pauseReason:null,totes:[]});
  changed=true;
 });
 if(changed){saveSessions(local);loadForMe();render();}
}
function fmt(ms){if(ms<0)ms=0;let s=Math.floor(ms/1000);const h=Math.floor(s/3600);s-=h*3600;const m=Math.floor(s/60);s-=m*60;
return(h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');}
function elapsed(s){const paused=s.totalPausedMs||0;if(s.status==='paused')return s.pausedAt-s.startTime-paused;
if(s.status==='completed')return s.endTime-s.startTime-paused;return Date.now()-s.startTime-paused;}
function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shortName(n){return(n||'').trim().split(/\s+/)[0]||n;}

/* ================= Local mirror (this device only) =================

   server; there's no "get my sessions" endpoint yet, so this device keeps a
   local copy of what IT started so the two screens below have something to
   show and survive a refresh. */
function allSessions(){try{return JSON.parse(localStorage.getItem('vpos_sessions')||'[]');}catch(e){return[];}}
function saveSessions(arr){localStorage.setItem('vpos_sessions',JSON.stringify(arr));}

let tickTimer=null;
let st={screen:'login',me:null,token:null,workerIdInput:'',pinInput:'',err:null,busy:false,connected:false,
 sessions:[],scanQuery:'',selBed:null,selAct:null,selCrop:null,showAllActs:false,showHistory:false,
 completingId:null,qty:'',unit:'',notes:'',isFinal:false,
 scoutingId:null,scoutDomain:null,scoutSymptom:'',scoutSeverity:null,scoutNotes:'',scoutRequiresAction:false,scoutPhotoDataUrl:'',
 exceptioningId:null,excType:null,excSeverity:null,excBlockedReason:'',excNotes:'',excPhotoDataUrl:'',
 breakPickerId:null,addingToteId:null,toteWeight:'',
 liveAssignedTasks:[],loadingTasks:false,assignedTasksUnavailable:false};

try{

 if(sess&&sess.token&&sess.me){st.me=sess.me;st.token=sess.token;st.screen='home';st.connected=true;}
}catch(e){}
function loadForMe(){st.sessions=allSessions().filter(s=>s.workerId===st.me.workerId).sort((a,b)=>b.startTime-a.startTime);}

async function attemptLogin(){

 st.busy=true;render();

 st.busy=false;
 if(!r.ok){st.err=r.error||'Login failed.';render();return;}
 st.me={workerId:r.data.workerId,name:r.data.name,role:r.data.role};

/** Planting-branch crop picker only applies when the bed has no cohort yet -- an
 *  already-planted bed (e.g. Replanting/Thinning) implies its own crop, nothing to pick. */
function needsCropPick(){
 return st.selAct&&branchFor(st.selAct.id)==='planting'&&st.selBed&&!bedDetail(st.selBed).cohortId;
}
function canStart(){
 if(!st.selBed||!st.selAct||st.busy)return false;
 if(needsCropPick()&&!st.selCrop)return false;
 return true;
}

async function confirmStart(){
 if(!canStart())return;
 st.busy=true;st.err=null;render();
 let r;
 if(needsCropPick()){
  // No cohort on this bed yet -- start-planting creates a minimal COHORT_PRODUCTION row for
  // the chosen crop and assigns it to the bed server-side, then starts the session in the
  // same call. See VPOS_Backend_Patch.gs (startPlantingNewCohort_) -- this route does not
  // exist in the plain start-activity path, which requires an existing cohort on the bed.
  r=await api('start-planting',{bedId:st.selBed,activityName:st.selAct.name,cropId:st.selCrop.id});
 }else{
  r=await api('start-activity',{bedId:st.selBed,activityName:st.selAct.name});
 }
 st.busy=false;
 if(handleAuthError(r))return;
 if(!r.ok){st.err=r.error||('Could not start that activity ('+(r.code||'error')+').');render();return;}
 if(r.data.cohortId){
  // Reflect the new cohort in this device's local snapshot immediately so the Bed Snapshot
  // card and Assigned Tasks list stay consistent without a reload -- same local-mirror
  // limitation as the rest of this file (see "Local mirror" note below).
  BED_STATE_SNAPSHOT[st.selBed]={status:'PLANTED',cohortId:r.data.cohortId};
  COHORT_SNAPSHOT[r.data.cohortId]={cropId:st.selCrop.id,cropName:st.selCrop.name,assignmentStatus:'ASSIGNED',
   currentStage:null,actualDob:new Date().toISOString().slice(0,10),harvestWindowStart:null,harvestWindowEnd:null};
 }
 const arr=allSessions();
 arr.push({id:r.data.sessionId,workerId:st.me.workerId,bedId:st.selBed,block:bedBlock(st.selBed),
  activityId:st.selAct.id,activityName:st.selAct.name,qtyBased:st.selAct.qtyBased,unit:st.selAct.unit,
  status:'active',startTime:Date.now(),totalPausedMs:0,pausedAt:null,pauseReason:null,totes:[]});
 saveSessions(arr);loadForMe();go('home');
}

}

 arr[idx]=Object.assign(arr[idx],patch);saveSessions(arr);loadForMe();
}

/* ---- Harvest Totes (running weigh-ins during one Harvest session) ----
 * HARVEST_LOG has no per-tote writer on the backend yet (see log-harvest: NOT_IMPLEMENTED
 * in Code_main.gs), so totes are kept here, on the session, and rolled up into a single
 * quantity + an itemized note when the worker finally taps Complete -- using the
 * end-activity route that already works today. Nothing is lost; it's just batched instead
 * of written as individual HARVEST_LOG rows. A future 'log-harvest-tote' route could write
 * each tote as its own HARVEST_LOG row (with Grade/ColdChain_Compliant) in real time --
 * swap addTote()'s local-only append for an api() call once that exists. */
function toteTotal(s){return(s.totes||[]).reduce((sum,t)=>sum+(Number(t.weight)||0),0);}
function toteNoteLine(s){
 const totes=s.totes||[];
 if(!totes.length)return'';
 return'Totes: '+totes.map(t=>t.weight).join(', ')+' '+(s.unit||'lbs')+' ('+totes.length+' weigh-ins).';
}
function toteSectionHtml(s,logging){
 const totes=s.totes||[];
 return `<div class="tote-box">
  <div class="tote-hd"><span>🧺 Totes: ${totes.length} · ${toteTotal(s)} ${esc(s.unit||'lbs')} total</span>
  ${s.status!=='completed'?(logging?`<span class="link" style="margin:0;" onclick="cancelToteEntry()">Cancel</span>`
    :`<span class="link" style="margin:0;" onclick="openToteEntry('${s.id}')">+ Log Tote</span>`):''}</div>
  ${totes.map((t,i)=>`<div class="tote-item"><span>Tote ${i+1}: ${esc(t.weight)} ${esc(s.unit||'lbs')}</span>
    <span class="tote-rm" onclick="removeTote('${s.id}',${i})">Remove</span></div>`).join('')}
  ${logging?`<div class="row" style="margin-top:8px;">
    <input type="number" inputmode="decimal" placeholder="Weight (${esc(s.unit||'lbs')})" value="${esc(st.toteWeight)}" oninput="st.toteWeight=this.value">
    <button class="btn small" onclick="addTote('${s.id}')">Add</button></div>`:''}
 </div>`;
}
function openToteEntry(id){st.addingToteId=id;st.toteWeight='';render();}
function cancelToteEntry(){st.addingToteId=null;st.toteWeight='';render();}
function addTote(id){
 const w=parseFloat(st.toteWeight);
 if(!w||w<=0){st.err='Enter a tote weight greater than 0.';render();return;}
 const arr=allSessions();const idx=arr.findIndex(s=>s.id===id);if(idx<0)return;
 arr[idx].totes=(arr[idx].totes||[]).concat([{weight:w,ts:Date.now()}]);
 saveSessions(arr);loadForMe();st.addingToteId=null;st.toteWeight='';st.err=null;render();
}
function removeTote(id,i){
 const arr=allSessions();const idx=arr.findIndex(s=>s.id===id);if(idx<0)return;
 arr[idx].totes=(arr[idx].totes||[]).filter((_,j)=>j!==i);
 saveSessions(arr);loadForMe();render();
}

function openComplete(id){

async function confirmComplete(id){

async function submitException(id){
 const s=st.sessions.find(x=>x.id===id);if(!s||st.busy)return;
 if(!st.excType||!st.excSeverity){st.err='Pick what kind of issue this is and a severity first.';render();return;}
